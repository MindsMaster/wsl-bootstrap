name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: 版本号 不带 v 只编译不发布
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      # build-netdistro.sh 用 unshare -rm 解包 rootfs 与运行 apk
      - name: 允许非特权用户命名空间
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: 版本号
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: echo "VERSION=${INPUT_VERSION:-${GITHUB_REF_NAME#v}}" >>"$GITHUB_ENV"

      - name: 格式与单元测试
        run: |
          zig fmt --check src build.zig
          zig build test

      - name: 编译
        run: bash tools/release.sh "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: wslb-${{ env.VERSION }}
          path: |
            dist/wslb-${{ env.VERSION }}.exe
            dist/wslb-${{ env.VERSION }}.exe.sha256
            dist/wslb-net.lock

      - name: 发布 Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/wslb-$VERSION.exe" "dist/wslb-$VERSION.exe.sha256" "dist/wslb-net.lock" \
            --title "wslb $VERSION" --generate-notes --verify-tag
